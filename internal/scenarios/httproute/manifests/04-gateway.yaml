apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: scn-gateway
  namespace: scn-httproute
spec:
  gatewayClassName: bnk-gatewayclass
  # Static address from the bnk-external docker network's range. In a
  # production BNK deployment this would come from an F5SPKVlan / IPAM
  # source; on kind we just pick something inside the docker bridge
  # subnet so the controller can mark Programmed=True without an
  # IP-allocation source.
  addresses:
  - type: IPAddress
    value: 203.0.113.100
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: Same
