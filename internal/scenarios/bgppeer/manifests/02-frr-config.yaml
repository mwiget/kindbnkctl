# FRR config for the BGP peer pod. Uses `bgp listen range` so we
# accept incoming BGP sessions from any Calico pod IP — sidesteps the
# chicken-and-egg of needing TMM's pod IP at apply time. The `daemons`
# file is the standard upstream shape; bgpd flagged on, everything
# else off.
apiVersion: v1
kind: ConfigMap
metadata:
  name: frr-config
  namespace: scn-bgp
data:
  daemons: |
    bgpd=yes
    ospfd=no
    ospf6d=no
    ripd=no
    ripngd=no
    isisd=no
    pimd=no
    ldpd=no
    nhrpd=no
    eigrpd=no
    babeld=no
    sharpd=no
    pbrd=no
    bfdd=no
    fabricd=no
    vrrpd=no
    pathd=no
    vtysh_enable=yes
    zebra_options="  -A 127.0.0.1 -s 90000000"
    bgpd_options="  -A 127.0.0.1"
  vtysh.conf: |
    service integrated-vtysh-config
  frr.conf: |
    frr defaults traditional
    hostname scn-frr
    log stdout informational
    !
    ! Enable IPv4 forwarding so the pod can act as a transit router
    ! for clients that have a static route pointing at this pod for
    ! the Gateway IP (http-routing-e2e scenario uses this).
    ip forwarding
    !
    router bgp 65001
     bgp router-id 1.1.1.1
     no bgp ebgp-requires-policy
     no bgp default ipv4-unicast
     bgp log-neighbor-changes
     ! Peer-group + remote-as MUST be declared before the listen-range
     ! references them — FRR silently drops `bgp listen range` lines
     ! that point at undefined peer-groups.
     neighbor from-tmm peer-group
     neighbor from-tmm remote-as 65000
     ! Accept BGP from any pod in the Calico range — TMM's pod IP is
     ! dynamic; we render its address into ZeBOS.conf on the TMM side.
     bgp listen range 10.244.0.0/16 peer-group from-tmm
     !
     address-family ipv4 unicast
      neighbor from-tmm activate
      neighbor from-tmm soft-reconfiguration inbound
     exit-address-family
    !
    line vty
    !
