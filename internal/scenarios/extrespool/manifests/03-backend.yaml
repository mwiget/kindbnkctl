# External-style backend running nginx on the bnk-bgp Multus NAD.
# Stands in for "a backend outside k8s networking" — uses the same
# bridge (br-bnk-bgp) TMM has a net1 interface on, so TMM can reach
# the pod IP at L2 without needing kernel-route plumbing.
#
# References the NAD via the cross-namespace form `default/bnk-bgp`
# so all pods on this bridge share the host-local IPAM state and
# don't fight over IPs.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ext-nginx-index
  namespace: scn-extres
data:
  index.html: |
    kindbnkctl-scenario-extres-pool-OK
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ext-backend
  namespace: scn-extres
  labels: {app: ext-backend}
spec:
  replicas: 1
  selector:
    matchLabels: {app: ext-backend}
  template:
    metadata:
      labels: {app: ext-backend}
      annotations:
        # Attach the cluster-wide bnk-bgp NAD on net1. host-local
        # IPAM auto-allocates a 192.168.99.x address; the scenario
        # discovers it at runtime and renders it into the Pool CR.
        k8s.v1.cni.cncf.io/networks: |
          [{"name":"bnk-bgp","interface":"net1"}]
    spec:
      # Co-locate on the f5-tmm-labelled node — bridge CNI is
      # per-node, so the backend must share a node with TMM for the
      # net1 traffic to bridge.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: app
                operator: In
                values: [f5-tmm]
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - {name: html, mountPath: /usr/share/nginx/html}
        readinessProbe:
          httpGet: {path: /, port: 80}
          initialDelaySeconds: 1
          periodSeconds: 2
        resources:
          requests: {cpu: 10m, memory: 16Mi}
          limits:   {cpu: 100m, memory: 64Mi}
      volumes:
      - name: html
        configMap: {name: ext-nginx-index}
